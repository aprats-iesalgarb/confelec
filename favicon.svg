<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fons fosc circular per destacar a la pestanya -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    
    <!-- Gradient del nucli -->
    <radialGradient id="nucleusGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </radialGradient>
    
    <!-- Efecte de resplendor per als electrons i el nucli -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fons base -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>

  <!-- Nivells d'energia / Orbitals (n=1, n=2, n=3) -->
  <circle cx="256" cy="256" r="80" stroke="#38bdf8" stroke-width="6" fill="none" opacity="0.4" stroke-dasharray="8 6"/>
  <circle cx="256" cy="256" r="140" stroke="#818cf8" stroke-width="6" fill="none" opacity="0.6"/>
  <circle cx="256" cy="256" r="200" stroke="#c084fc" stroke-width="6" fill="none" opacity="0.8"/>

  <!-- Nucli atòmic -->
  <circle cx="256" cy="256" r="32" fill="url(#nucleusGrad)" filter="url(#glow)"/>

  <!-- Electrons capa n=1 (1s) -->
  <g filter="url(#glow)">
    <circle cx="256" cy="176" r="14" fill="#38bdf8"/>
    <circle cx="256" cy="336" r="14" fill="#38bdf8"/>
  </g>

  <!-- Electrons capa n=2 (2s, 2p) -->
  <g filter="url(#glow)">
    <circle cx="396" cy="256" r="14" fill="#818cf8"/>
    <circle cx="116" cy="256" r="14" fill="#818cf8"/>
    <circle cx="355" cy="157" r="14" fill="#818cf8"/>
    <circle cx="157" cy="355" r="14" fill="#818cf8"/>
  </g>

  <!-- Electrons de valència capa n=3 amb fletxes de spin (+1/2 i -1/2) -->
  <g filter="url(#glow)">
    <!-- Electró amb spin amunt -->
    <circle cx="256" cy="56" r="16" fill="#38bdf8"/>
    <path d="M256 64 L256 48 M252 52 L256 48 L260 52" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Electró amb spin avall -->
    <circle cx="456" cy="256" r="16" fill="#c084fc"/>
    <path d="M456 248 L456 264 M452 260 L456 264 L460 260" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
